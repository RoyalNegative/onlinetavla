<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OnlineTavla — ücretsiz online tavla">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#1a2634"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Board triangles motif (left) -->
  <g opacity="0.9">
    <polygon points="120,150 175,150 147,340" fill="#f59e0b"/>
    <polygon points="185,150 240,150 212,340" fill="#e5e7eb"/>
    <polygon points="250,150 305,150 277,340" fill="#f59e0b"/>
    <polygon points="120,480 175,480 147,290" fill="#e5e7eb"/>
    <polygon points="185,480 240,480 212,290" fill="#f59e0b"/>
    <polygon points="250,480 305,480 277,290" fill="#e5e7eb"/>
  </g>

  <!-- Dice -->
  <g transform="translate(140,420)">
    <rect x="0" y="0" width="90" height="90" rx="18" fill="url(#amber)"/>
    <circle cx="26" cy="26" r="9" fill="#0f1720"/>
    <circle cx="64" cy="64" r="9" fill="#0f1720"/>
    <circle cx="45" cy="45" r="9" fill="#0f1720"/>
  </g>

  <!-- Text -->
  <text x="400" y="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="92" font-weight="800" fill="#ffffff">Online <tspan fill="url(#amber)">Tavla</tspan></text>
  <text x="402" y="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="600" fill="#9ca3af">Arkadaşınla ücretsiz oyna</text>
  <text x="402" y="410" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#e5e7eb">Oda kur · linki paylaş · saniyede başla</text>
  <text x="402" y="455" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#6b7280">Reklamsız · üyeliksiz · klasik &amp; çift zarlı</text>

  <text x="400" y="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="url(#amber)">onlinetavla-asaby.com</text>
</svg>
